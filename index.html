    <style>
        /* ===== ESTILOS ORIGINAIS (NÃO ALTERADOS) ===== */

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .price-row {

        .price {

        .change.positive { color: #7ddfa0; }
        .change.negative { color: #f28b82; }
        .indicator-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            margin: 12px 0 6px;
        }
        .indicator-item {
            font-size: 0.8rem;
            color: #b0c4de;
        }
        .indicator-item span {
            color: #e8edf5;
            font-weight: 500;

        .signal-box {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            background: #0f1722;
            border-left: 4px solid #2a3a4a;

        .signal-box .label {

            font-size: 0.7rem;

            letter-spacing: 0.5px;

        .signal-box .value {
            font-weight: 600;
            font-size: 1.1rem;
        }
        .signal-box .value.long { color: #7ddfa0; }
        .signal-box .value.short { color: #f28b82; }
        .signal-box .value.neutral { color: #f0c674; }
        .chart-container {
            position: relative;
            height: 180px;
            margin-top: 12px;
        }
        .log-area {
            background: #0a1018;
            border-radius: 12px;
            padding: 16px;
            max-height: 260px;
            overflow-y: auto;
            font-family: 'Fira Code', monospace;
            font-size: 0.75rem;
            line-height: 1.6;
            border: 1px solid #1a232e;
            color: #b0c4de;
        }
        .log-area .entry {
            border-bottom: 1px solid #141e2a;
            padding: 4px 0;
        }
        .log-area .entry .time {
            color: #6a7f9a;
            margin-right: 10px;
        }
        .log-area .entry .signal-long { color: #7ddfa0; }
        .log-area .entry .signal-short { color: #f28b82; }
        .log-area .entry .info { color: #f0c674; }
        ::-webkit-scrollbar {

        @media (max-width: 640px) {
            .header { flex-direction: column; align-items: stretch; }

<body>
<div class="container">
    <div class="header">
        <h1>⚡ SMC+MTF Engine v2.1</h1>
        <div class="status-badge">
            <span class="badge active" id="statusLive">● AO VIVO</span>

        <!-- Cards serão preenchidos dinamicamente -->

    <div class="card">
        <div class="card-header">

            <button id="clearLogBtn" style="background: none; border: none; color: #6a7f9a; cursor: pointer; font-size: 0.8rem;">Limpar</button>

<script>
    // ============================================================
    //  CONFIGURAÇÕES GLOBAIS (ORIGINAL)
    // ============================================================
    const SYMBOLS = ['BTCUSDT', 'ETHUSDT', 'SOLUSDT'];
    const INTERVAL_1H = '1h';
    const INTERVAL_4H = '4h';
    const POLLING_MS = 120000; // 2 min
    const TELEGRAM_BOT_TOKEN = '7154225685:AAFxVZ0edcETi1Evz_-nXEYx4sA4b5eymWs';
    const TELEGRAM_CHAT_ID = '5828578057';

    // ============================================================
    //  ESTADO GLOBAL (ORIGINAL)
    // ============================================================
    const assetsData = {};
    let activePositions = {};
    let logEntries = [];
    let chartInstances = {};
    let lastUpdateTime = Date.now();

    // ============================================================
    //  FUNÇÕES AUXILIARES (ORIGINAL)
    // ============================================================
    function clamp(v, min, max) { return Math.min(Math.max(v, min), max); }

    function formatPrice(p) { return p.toFixed(2); }
    function formatPercent(p) { return (p >= 0 ? '+' : '') + p.toFixed(2) + '%'; }

    function getUTCDateKey(d) {
        return d.getUTCFullYear() + '-' + String(d.getUTCMonth()+1).padStart(2,'0') + '-' + String(d.getUTCDate()).padStart(2,'0');
    }

    // ============================================================
    //  #1 - FILTRO MACRO DINÂMICO (substitui macroBlockDates)
    // ============================================================
    function isSafeToTrade(symbol) {
        const now = new Date();
        const hourUTC = now.getUTCHours();
        const minUTC = now.getUTCMinutes();
        const day = now.getUTCDate();
        const month = now.getUTCMonth() + 1;
        const year = now.getUTCFullYear();

        // --- Bloqueio de eventos de alto impacto ---
        // 1) Primeira quarta-feira do mês -> FOMC statement (14:00 ET = 18:00-19:00 UTC)
        const firstWednesday = (() => {
            let d = new Date(Date.UTC(year, month-1, 1));
            while (d.getUTCDay() !== 3) d.setUTCDate(d.getUTCDate() + 1);
            return d.getUTCDate();
        })();
        if (day === firstWednesday && hourUTC >= 18 && hourUTC <= 19) {
            return false;
        }

        // 2) Dias 1 a 5 do mês -> CPI/NFP (08:30 ET = 12:30-13:30 UTC)
        if (day <= 5 && hourUTC >= 12 && hourUTC <= 13 && minUTC >= 20) {
            return false;
        }
        if (day <= 5 && hourUTC === 13 && minUTC <= 40) {
            return false;
        }

        // --- Proxy dinâmico: spike de volatilidade (ATR 1H) ---
        const data = assetsData[symbol];
        if (data && data.atrHistory && data.atrHistory.length > 20) {
            const recent = data.atrHistory.slice(-20);
            const avgATR = recent.reduce((a,b) => a + b, 0) / recent.length;
            if (data.atr_1H > avgATR * 2.5) {
                return false;  // volatilidade extrema = evento em curso
            }
        }

        // --- Janela de horário favorável (UTC) ---
        if ((hourUTC >= 13 && hourUTC <= 17) || (hourUTC >= 0 && hourUTC <= 4)) {
            return true;
        }
        return false;
    }

    // ============================================================
    //  #2 - CHOPPINESS INDEX (filtro de lateralidade)
    // ============================================================
    function computeChoppiness(data) {
        const candles = data.candles1H;
        if (!candles || candles.length < 14) return 50;
        const slice = candles.slice(-14);
        const highs = slice.map(k => k.high);
        const lows = slice.map(k => k.low);
        let trSum = 0;
        for (let i = 1; i < slice.length; i++) {
            const high = slice[i].high;
            const low = slice[i].low;
            const prevClose = slice[i-1].close;
            const tr = Math.max(high - low, Math.abs(high - prevClose), Math.abs(low - prevClose));
            trSum += tr;
        }
        const avgTR = trSum / (slice.length - 1);
        const totalMovement = avgTR * 14;
        const range = Math.max(...highs) - Math.min(...lows);
        if (range === 0) return 100;
        const chop = 100 * Math.log10(totalMovement / range) / Math.log10(14);
        return clamp(chop, 0, 100);
    }

    // ============================================================
    //  #4 - BUSCAR OPEN INTEREST (OI Delta real)
    // ============================================================
    async function fetchOpenInterest(symbol) {
        try {
            const url = `https://fapi.binance.com/futures/data/openInterestHist?symbol=${symbol}&period=15m&limit=2`;
            const resp = await fetch(url);
            if (!resp.ok) return;
            const data = await resp.json();
            if (data && data.length === 2) {
                const prev = parseFloat(data[0].sumOpenInterest);
                const curr = parseFloat(data[1].sumOpenInterest);
                if (prev > 0) {
                    const delta = ((curr - prev) / prev) * 100;
                    if (assetsData[symbol]) {
                        assetsData[symbol].oiDelta = delta;
                    }
                }
            }
        } catch (e) {
            // silencia
        }
    }

    // ============================================================
    //  #6 - BOS COM CONFIRMAÇÃO DE VOLUME (modifica updateSwingPoints)
    // ============================================================
    function updateSwingPoints(data) {
        const c1H = data.candles1H;
        if (!c1H || c1H.length < 20) return;
        const recentHighs = [];
        const recentLows = [];
        const start = Math.max(0, c1H.length - 20);
        for (let i = start; i < c1H.length - 1; i++) {
            // Volume médio dos últimos 10 candles (antes do atual)
            const volSlice = c1H.slice(Math.max(0, i - 10), i);
            const avgVol = volSlice.reduce((s, k) => s + k.volume, 0) / (volSlice.length || 1);
            const volConfirm = c1H[i].volume > avgVol * 1.3;
            if (!volConfirm) continue;

            if (c1H[i].high > c1H[i-1].high && c1H[i].high > c1H[i+1].high) {
                recentHighs.push(c1H[i].high);
            }
            if (c1H[i].low < c1H[i-1].low && c1H[i].low < c1H[i+1].low) {
                recentLows.push(c1H[i].low);
            }
        }
        data.recentHighs = recentHighs.slice(-5);
        data.recentLows = recentLows.slice(-5);
    }

    // ============================================================
    //  CÁLCULO DE INDICADORES (ORIGINAL)
    // ============================================================
    function calculateATR(highs, lows, closes, period) {
        if (highs.length < period + 1) return 0;
        let trSum = 0;
        for (let i = 1; i <= period; i++) {
            const idx = highs.length - i;
            const tr = Math.max(
                highs[idx] - lows[idx],
                Math.abs(highs[idx] - closes[idx-1]),
                Math.abs(lows[idx] - closes[idx-1])
            );
            trSum += tr;
        }
        return trSum / period;
    }

    function calculateRSI(closes, period) {
        if (closes.length < period + 1) return 50;
        let gains = 0, losses = 0;
        for (let i = closes.length - period; i < closes.length - 1; i++) {
            const diff = closes[i+1] - closes[i];
            if (diff >= 0) gains += diff;
            else losses -= diff;
        }
        const avgGain = gains / period;
        const avgLoss = losses / period;
        if (avgLoss === 0) return 100;
        const rs = avgGain / avgLoss;
        return 100 - (100 / (1 + rs));
    }

    function calculateEMA(values, period) {
        if (values.length < period) return null;
        const k = 2 / (period + 1);
        let ema = values.slice(0, period).reduce((a,b) => a + b, 0) / period;
        for (let i = period; i < values.length; i++) {
            ema = values[i] * k + ema * (1 - k);
        }
        return ema;
    }

    // ============================================================
    //  #5 - RSI ANTI-TRAP (modifica momScore em computeScore)
    // ============================================================
    function computeScore(data, mtfTrend) {
        // Componentes base
        let mtfScore = 50;
        if (mtfTrend === 'LONG') mtfScore = 70;
        else if (mtfTrend === 'SHORT') mtfScore = 30;

        // SMC BOS
        let smcScore = 50;
        if (data.recentHighs && data.recentHighs.length > 2) smcScore = 70;
        if (data.recentLows && data.recentLows.length > 2) smcScore = 30;

        // RSI (momento)
        let rsi = data.rsi_1H || 50;
        let momScore = clamp(rsi, 0, 100);

        // --- Penalização por extremos (anti-trap) ---
        if (mtfTrend === 'LONG' && rsi > 75) momScore = momScore * 0.6;
        if (mtfTrend === 'SHORT' && rsi < 25) momScore = 100 - momScore;

        // Orderflow / Liquidez (simulado)
        let liqScore = 50;
        if (data.volumeSpike) liqScore = 70;
        if (data.volumeSpike === false) liqScore = 30;

        // OI Delta (agora atualizado)
        let oiScore = 50;
        if (data.oiDelta !== undefined && data.oiDelta !== null) {
            if (data.oiDelta > 5) oiScore = 70;
            else if (data.oiDelta < -5) oiScore = 30;
            else oiScore = 50;
        }

        // Macro / Sessão (já filtrado em isSafeToTrade)
        let macroScore = 50;

        // Ponderação
        let rawScore = 0.30 * mtfScore + 0.30 * smcScore + 0.15 * momScore + 0.10 * liqScore + 0.05 * oiScore + 0.10 * macroScore;
        rawScore = clamp(rawScore, 0, 100);

        // --- #2 Aplicar filtro de Choppiness (achata score em range) ---
        const chop = computeChoppiness(data);
        data.chopIndex = chop;
        if (chop > 61) {
            rawScore = 50 + (rawScore - 50) * 0.3;
        }
        rawScore = clamp(rawScore, 0, 100);

        return rawScore;
    }

    // ============================================================
    //  #3 - TAKE PROFIT PARCIAL (modifica checkPositionManagement)
    // ============================================================
    function checkPositionManagement(symbol, data) {
        const pos = activePositions[symbol];
        if (!pos) return false;
        const currentPrice = data.price;
        if (!currentPrice) return false;

        let updateUI = false;
        const atr = data.atr_1H || 0;

        // LONG
        if (pos.side === 'LONG') {
            // TP1 parcial (50%)
            if (currentPrice >= pos.tp1 && !pos.partialTaken) {
                pos.partialTaken = true;
                pos.realizedPNL = (pos.tp1 - pos.entryPrice) * 0.5;
                pos.sizeRemaining = 0.5;
                pos.trailingStop = pos.entryPrice + (atr * 0.1);
                pos.movedToBE = true;
                sendTelegramAlert(`🎯 <b>TP1 PARCIAL (${symbol})</b>\n50% realizado em $${pos.tp1.toFixed(2)}\nRestante com trailing ativo`);
                updateUI = true;
            }
            // Trailing para a parte restante
            if (pos.partialTaken && pos.trailingStop) {
                if (currentPrice > pos.trailingStop) {
                    const newStop = currentPrice - (atr * 1.2);
                    if (newStop > pos.trailingStop) {
                        pos.trailingStop = newStop;
                        updateUI = true;
                    }
                }
                if (currentPrice <= pos.trailingStop) {
                    pos.sizeRemaining = 0;
                    pos.realizedPNL += (currentPrice - pos.entryPrice) * 0.5;
                    sendTelegramAlert(`🔴 <b>TP2 (restante) acionado (${symbol})</b>\nPreço: $${currentPrice.toFixed(2)}\nLucro total: $${pos.realizedPNL.toFixed(2)}`);
                    delete activePositions[symbol];
                    updateUI = true;
                }
            }
            // Se não houve parcial ainda, verifica se atinge TP2 (fecha tudo)
            if (!pos.partialTaken && currentPrice >= pos.tp2) {
                pos.realizedPNL = (pos.tp2 - pos.entryPrice);
                sendTelegramAlert(`✅ <b>TP2 TOTAL (${symbol})</b>\nLucro: $${pos.realizedPNL.toFixed(2)}`);
                delete activePositions[symbol];
                updateUI = true;
            }
            // Stop Loss
            if (currentPrice <= pos.stopLoss && !pos.partialTaken) {
                pos.realizedPNL = (pos.stopLoss - pos.entryPrice);
                sendTelegramAlert(`❌ <b>STOP LOSS (${symbol})</b>\nPerda: $${pos.realizedPNL.toFixed(2)}`);
                delete activePositions[symbol];
                updateUI = true;
            }
        }

        // SHORT (espelhado)
        if (pos.side === 'SHORT') {
            if (currentPrice <= pos.tp1 && !pos.partialTaken) {
                pos.partialTaken = true;
                pos.realizedPNL = (pos.entryPrice - pos.tp1) * 0.5;
                pos.sizeRemaining = 0.5;
                pos.trailingStop = pos.entryPrice - (atr * 0.1);
                pos.movedToBE = true;
                sendTelegramAlert(`🎯 <b>TP1 PARCIAL SHORT (${symbol})</b>\n50% realizado em $${pos.tp1.toFixed(2)}\nRestante com trailing ativo`);
                updateUI = true;
            }
            if (pos.partialTaken && pos.trailingStop) {
                if (currentPrice < pos.trailingStop) {
                    const newStop = currentPrice + (atr * 1.2);
                    if (newStop < pos.trailingStop) {
                        pos.trailingStop = newStop;
                        updateUI = true;
                    }
                }
                if (currentPrice >= pos.trailingStop) {
                    pos.sizeRemaining = 0;
                    pos.realizedPNL += (pos.entryPrice - currentPrice) * 0.5;
                    sendTelegramAlert(`🔴 <b>TP2 restante SHORT (${symbol})</b>\nPreço: $${currentPrice.toFixed(2)}\nLucro total: $${pos.realizedPNL.toFixed(2)}`);
                    delete activePositions[symbol];
                    updateUI = true;
                }
            }
            if (!pos.partialTaken && currentPrice <= pos.tp2) {
                pos.realizedPNL = (pos.entryPrice - pos.tp2);
                sendTelegramAlert(`✅ <b>TP2 TOTAL SHORT (${symbol})</b>\nLucro: $${pos.realizedPNL.toFixed(2)}`);
                delete activePositions[symbol];
                updateUI = true;
            }
            if (currentPrice >= pos.stopLoss && !pos.partialTaken) {
                pos.realizedPNL = (pos.entryPrice - pos.stopLoss);
                sendTelegramAlert(`❌ <b>STOP LOSS SHORT (${symbol})</b>\nPerda: $${pos.realizedPNL.toFixed(2)}`);
                delete activePositions[symbol];
                updateUI = true;
            }
        }

        return updateUI;
    }

    // ============================================================
    //  DETECÇÃO DE SMC SETUP (ORIGINAL)
    // ============================================================
    function findSMCSetup(data) {
        const highs = data.recentHighs || [];
        const lows = data.recentLows || [];
        if (highs.length < 2 || lows.length < 2) return 'NEUTRAL';
        const lastHigh = highs[highs.length-1];
        const prevHigh = highs[highs.length-2];
        const lastLow = lows[lows.length-1];
        const prevLow = lows[lows.length-2];
        const price = data.price;

        if (price > lastHigh && lastHigh > prevHigh) return 'LONG';
        if (price < lastLow && lastLow < prevLow) return 'SHORT';
        return 'NEUTRAL';
    }

    // ============================================================
    //  TELEGRAM (ORIGINAL)
    // ============================================================
    async function sendTelegramAlert(message) {
        try {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            const payload = {
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'HTML'
            };
            await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch(e) { /* silencia */ }
    }

    // ============================================================
    //  ATUALIZAÇÃO DE DADOS (BINANCE) - ORIGINAL
    // ============================================================
    async function fetchBinanceKlines(symbol, interval, limit = 100) {
        const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Binance API error');
        const data = await resp.json();
        return data.map(k => ({
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
            volume: parseFloat(k[5])
        }));
    }

    async function fetchCurrentPrice(symbol) {
        const url = `https://api.binance.com/api/v3/ticker/price?symbol=${symbol}`;
        const resp = await fetch(url);
        if (!resp.ok) throw new Error('Price fetch error');
        const data = await resp.json();
        return parseFloat(data.price);
    }

    // ============================================================
    //  WARM-UP & ATUALIZAÇÃO COMPLETA (modificada para incluir atrHistory e oiDelta)
    // ============================================================
    async function warmUpIndicators(symbol) {
        try {
            const c1H = await fetchBinanceKlines(symbol, INTERVAL_1H, 100);
            const c4H = await fetchBinanceKlines(symbol, INTERVAL_4H, 60);
            const price = await fetchCurrentPrice(symbol);

            const closes1H = c1H.map(k => k.close);
            const highs1H = c1H.map(k => k.high);
            const lows1H = c1H.map(k => k.low);

            const rsi = calculateRSI(closes1H, 14);
            const atr = calculateATR(highs1H, lows1H, closes1H, 14);

            // --- #1 Manter histórico de ATR para proxy de volatilidade ---
            let atrHistory = [];
            if (assetsData[symbol] && assetsData[symbol].atrHistory) {
                atrHistory = assetsData[symbol].atrHistory;
            }
            atrHistory.push(atr);
            if (atrHistory.length > 100) atrHistory.shift();

            // Tendência MTF (4H EMA)
            const closes4H = c4H.map(k => k.close);
            const ema20_4H = calculateEMA(closes4H, 20);
            const ema50_4H = calculateEMA(closes4H, 50);
            let mtfTrend = 'NEUTRAL';
            if (ema20_4H !== null && ema50_4H !== null) {
                if (ema20_4H > ema50_4H) mtfTrend = 'LONG';
                else if (ema20_4H < ema50_4H) mtfTrend = 'SHORT';
            }

            // Volume spike (simples)
            const avgVol = closes1H.slice(-20).reduce((s, _, i, arr) => s + (c1H[i]?.volume || 0), 0) / 20;
            const lastVol = c1H[c1H.length-1]?.volume || 0;
            const volumeSpike = lastVol > avgVol * 1.5;

            const data = {
                symbol,
                price,
                candles1H: c1H,
                candles4H: c4H,
                rsi_1H: rsi,
                atr_1H: atr,
                atrHistory,           // <-- adicionado
                mtfTrend,
                volumeSpike,
                recentHighs: [],
                recentLows: [],
                oiDelta: assetsData[symbol]?.oiDelta || 0, // <-- mantém valor
                chopIndex: 50,
            };

            // Atualiza swing points com volume
            updateSwingPoints(data);

            assetsData[symbol] = data;
        } catch (e) {
            console.error(`Erro ao aquecer ${symbol}:`, e);
        }
    }

    async function refreshAll() {
        for (const sym of SYMBOLS) {
            await warmUpIndicators(sym);
            // --- #4 Busca OI Delta (real) ---
            await fetchOpenInterest(sym);
        }
        lastUpdateTime = Date.now();
        document.getElementById('lastUpdate').textContent = 'Atualizado: ' + new Date().toLocaleTimeString();
        renderCards();
        checkSignals();
        updateCharts();
        updateLog();
    }

    // ============================================================
    //  RENDER CARDS (ORIGINAL, com exibição do chopIndex e oiDelta)
    // ============================================================
    function renderCards() {
        const container = document.getElementById('cardsContainer');
        container.innerHTML = '';
        for (const sym of SYMBOLS) {
            const data = assetsData[sym];
            if (!data) continue;
            const card = document.createElement('div');
            card.className = 'card';
            card.id = 'card-' + sym;
            const change = data.price ? ((data.price - data.candles1H[data.candles1H.length-2]?.close) / data.candles1H[data.candles1H.length-2]?.close * 100) : 0;
            const changeClass = change >= 0 ? 'positive' : 'negative';

            const pos = activePositions[sym];
            let signalText = 'Aguardando';
            let signalClass = 'neutral';
            if (pos) {
                signalText = pos.side + ' (ativo)';
                signalClass = pos.side.toLowerCase();
            } else {
                const lastSignal = logEntries.filter(e => e.symbol === sym && e.type === 'signal').pop();
                if (lastSignal) {
                    signalText = lastSignal.signal;
                    signalClass = lastSignal.signal.toLowerCase();
                }
            }

            card.innerHTML = `
                <div class="card-header">
                    <h3><span class="symbol">${sym}</span></h3>
                    <span class="badge ${signalClass === 'long' ? 'active' : signalClass === 'short' ? 'warning' : ''}">${signalText}</span>
                </div>
                <div class="price-row">
                    <span class="price">$${formatPrice(data.price)}</span>
                    <span class="change ${changeClass}">${formatPercent(change)}</span>
                </div>
                <div class="indicator-group">
                    <div class="indicator-item">RSI: <span>${data.rsi_1H?.toFixed(1) || '--'}</span></div>
                    <div class="indicator-item">ATR: <span>${data.atr_1H?.toFixed(2) || '--'}</span></div>
                    <div class="indicator-item">MTF: <span>${data.mtfTrend || 'NEUTRAL'}</span></div>
                    <div class="indicator-item">Chop: <span>${data.chopIndex?.toFixed(1) || '--'}</span></div>
                    <div class="indicator-item">OI Δ: <span>${(data.oiDelta || 0).toFixed(2)}%</span></div>
                </div>
                <div class="signal-box">
                    <div class="label">Sinal Atual</div>
                    <div class="value ${signalClass}">${signalText}</div>
                </div>
                <div class="chart-container">
                    <canvas id="chart-${sym}"></canvas>
                </div>
            `;
            container.appendChild(card);
        }
        setTimeout(initCharts, 100);
    }

    // ============================================================
    //  GRÁFICOS (ORIGINAL)
    // ============================================================
    function initCharts() {
        for (const sym of SYMBOLS) {
            const canvas = document.getElementById('chart-' + sym);
            if (!canvas) continue;
            const data = assetsData[sym];
            if (!data) continue;
            if (chartInstances[sym]) {
                chartInstances[sym].destroy();
            }
            const ctx = canvas.getContext('2d');
            const closes = data.candles1H.slice(-30).map(k => k.close);
            const labels = closes.map((_, i) => i);
            chartInstances[sym] = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Preço',
                        data: closes,
                        borderColor: '#f0b429',
                        backgroundColor: 'rgba(240,180,41,0.1)',
                        pointRadius: 0,
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { enabled: false }
                    },
                    scales: {
                        x: { display: false },
                        y: { display: false }
                    },
                    animation: { duration: 0 }
                }
            });
        }
    }

    function updateCharts() {
        for (const sym of SYMBOLS) {
            const chart = chartInstances[sym];
            if (!chart) continue;
            const data = assetsData[sym];
            if (!data) continue;
            const closes = data.candles1H.slice(-30).map(k => k.close);
            chart.data.datasets[0].data = closes;
            chart.update('none');
        }
    }

    // ============================================================
    //  LÓGICA DE SINAIS E ENTRADAS (ORIGINAL, com uso de isSafeToTrade)
    // ============================================================
    function checkSignals() {
        for (const sym of SYMBOLS) {
            const data = assetsData[sym];
            if (!data) continue;

            if (activePositions[sym]) {
                const updated = checkPositionManagement(sym, data);
                if (updated) renderCards();
                continue;
            }

            // #1 - Filtro macro dinâmico
            if (!isSafeToTrade(sym)) {
                document.getElementById('tradeFilter').textContent = '🔒 Filtro Ativo (Evento/Vol)';
                continue;
            } else {
                document.getElementById('tradeFilter').textContent = '🔓 Mercado Aberto';
            }

            const score = computeScore(data, data.mtfTrend);
            data.score = score;

            const smcSetup = findSMCSetup(data);

            let entrySignal = null;
            if (score >= 75 && smcSetup === 'LONG' && data.mtfTrend === 'LONG') {
                entrySignal = 'LONG';
            } else if (score <= 25 && smcSetup === 'SHORT' && data.mtfTrend === 'SHORT') {
                entrySignal = 'SHORT';
            }

            if (entrySignal && !activePositions[sym]) {
                const atr = data.atr_1H || 0;
                const entryPrice = data.price;
                let stopLoss, tp1, tp2;
                if (entrySignal === 'LONG') {
                    stopLoss = entryPrice - (atr * 1.5);
                    tp1 = entryPrice + (atr * 2);
                    tp2 = entryPrice + (atr * 4);
                } else {
                    stopLoss = entryPrice + (atr * 1.5);
                    tp1 = entryPrice - (atr * 2);
                    tp2 = entryPrice - (atr * 4);
                }

                activePositions[sym] = {
                    side: entrySignal,
                    entryPrice: entryPrice,
                    stopLoss: stopLoss,
                    tp1: tp1,
                    tp2: tp2,
                    partialTaken: false,
                    sizeRemaining: 1,
                    movedToBE: false,
                    realizedPNL: 0,
                    trailingStop: null,
                };

                logEntries.push({
                    time: new Date().toISOString(),
                    symbol: sym,
                    type: 'signal',
                    signal: entrySignal,
                    score: score,
                    price: entryPrice,
                });

                sendTelegramAlert(`🚀 <b>ENTRADA ${entrySignal} (${sym})</b>\nPreço: $${entryPrice.toFixed(2)}\nScore: ${score.toFixed(1)}\nStop: $${stopLoss.toFixed(2)}\nTP1: $${tp1.toFixed(2)}\nTP2: $${tp2.toFixed(2)}`);
                renderCards();
                updateLog();
            }
        }
    }

    // ============================================================
    //  LOG (ORIGINAL)
    // ============================================================
    function updateLog() {
        const area = document.getElementById('logArea');
        let html = '';
        const entries = logEntries.slice(-30);
        for (const e of entries) {
            const time = new Date(e.time).toLocaleTimeString();
            let cls = 'info';
            let text = `${e.symbol} - `;
            if (e.type === 'signal') {
                cls = e.signal.toLowerCase();
                text += `<span class="signal-${cls}">${e.signal} (score ${e.score?.toFixed(1)}) $${e.price?.toFixed(2)}</span>`;
            } else {
                text += e.message || '';
            }
            html += `<div class="entry"><span class="time">[${time}]</span> ${text}</div>`;
        }
        area.innerHTML = html;
        area.scrollTop = area.scrollHeight;
    }

    // ============================================================
    //  POLLING (ORIGINAL)
    // ============================================================
    setInterval(refreshAll, POLLING_MS);

    // Inicialização
    refreshAll();

    // Limpar log
    document.getElementById('clearLogBtn').addEventListener('click', () => {
        logEntries = [];
        updateLog();
    });

    // ============================================================
    //  EXPORTA PARA DEBUG (ORIGINAL)
    // ============================================================
    window.__engine = { assetsData, activePositions, logEntries, refreshAll };
</script>
</body>
</html>
